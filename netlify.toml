[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/dist"

[dev]
  command = "npm run dev"
  port = 5173

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[context.deploy-preview.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[context.branch-deploy.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
